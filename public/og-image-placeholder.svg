<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Radial Glow -->
  <circle cx="600" cy="100" r="400" fill="#1E40AF" opacity="0.25" filter="blur(80px)"/>
  <circle cx="900" cy="500" r="350" fill="#3B82F6" opacity="0.15" filter="blur(100px)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200" />
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630" />
  </g>
  
  <!-- Main Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
  
  <!-- Logo Icon -->
  <rect x="140" y="140" width="72" height="72" rx="18" fill="#2563EB"/>
  <text x="176" y="188" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">CG</text>
  
  <!-- Brand Name & Tagline -->
  <text x="236" y="172" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" tracking="tight">CalcGlobal</text>
  <text x="236" y="202" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#60A5FA">calcglobal.org</text>
  
  <!-- Hero Title -->
  <text x="140" y="290" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">Tax &amp; Financial Calculators</text>
  <text x="140" y="350" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#94A3B8">Verified Against 2026 Official Government Authority Rates</text>
  
  <!-- Country Badges -->
  <g transform="translate(140, 410)">
    <!-- US -->
    <rect x="0" y="0" width="140" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="70" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🇺🇸 USA</text>
    
    <!-- UK -->
    <rect x="156" y="0" width="140" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="226" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🇬🇧 UK</text>
    
    <!-- FR -->
    <rect x="312" y="0" width="140" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="382" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🇫🇷 France</text>
    
    <!-- DE -->
    <rect x="468" y="0" width="140" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="538" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🇩🇪 Germany</text>
    
    <!-- AU -->
    <rect x="624" y="0" width="150" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="699" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🇦🇺 Australia</text>
  </g>
  
  <!-- Verified Badge -->
  <g transform="translate(900, 140)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#065F46" fill-opacity="0.8" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#10B981"/>
    <text x="100" y="25" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">2026 VERIFIED</text>
  </g>
</svg>
